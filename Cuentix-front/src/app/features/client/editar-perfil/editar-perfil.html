<div class="editar-contenedor">
  <h1>Editar perfil</h1>
  <div class="contenido-editar">
    @if (confirmarEliminacion) {
      <div class="confirmacion">¿Seguro que desea eliminar su cuenta?</div>
    }

    <div class="tarjeta-editar">
      <form class="formulario" (ngSubmit)="guardarDatos()" novalidate>
        <div class="campo">
          <span class="field-label">
            <label for="dni">DNI</label>
            <app-field-help
              field="DNI"
              message="Aquí puedes consultar el DNI de 8 dígitos asociado a tu cuenta. El campo es de solo lectura."
            />
          </span>
          <input id="dni" name="dni" type="text" [value]="dni" readonly />
        </div>

        <div class="campo">
          <span class="field-label">
            <label for="nombre">Nombre</label>
            <app-field-help
              field="Nombre"
              message="Actualiza tus nombres tal como figuran en tu DNI. Puedes usar letras, espacios, puntos, apóstrofos y guiones."
            />
          </span>
          <input id="nombre" name="nombre" type="text" [(ngModel)]="nombre" required />
        </div>

        <div class="campo">
          <span class="field-label">
            <label for="apellido">Apellido</label>
            <app-field-help
              field="Apellido"
              message="Actualiza tus apellidos completos. Puedes usar letras, espacios, puntos, apóstrofos y guiones."
            />
          </span>
          <input id="apellido" name="apellido" type="text" [(ngModel)]="apellido" required />
        </div>

        <div class="campo">
          <span class="field-label">
            <label for="contrasenaActual">Contraseña actual</label>
            <app-field-help
              field="Contraseña actual"
              message="Escribe tu contraseña vigente si quieres cambiarla. Para actualizar solo tus datos personales, deja este campo vacío."
            />
          </span>

          <input
            id="contrasenaActual"
            name="contrasenaActual"
            type="password"
            [(ngModel)]="contrasenaActual"
            autocomplete="current-password"
            placeholder="Solo para cambiar contraseña"
          />
        </div>

        <div class="campo">
          <span class="field-label">
            <label for="contrasena">Nueva contraseña</label>
            <app-field-help
              field="Nueva contraseña"
              message="Escribe una contraseña de al menos 8 caracteres si quieres reemplazar la actual. Deja el campo vacío para conservarla."
            />
          </span>
          <input
            id="contrasena"
            name="contrasena"
            type="password"
            [(ngModel)]="nuevaContrasena"
            autocomplete="new-password"
            placeholder="Opcional"
          />
        </div>

        <div class="campo">
          <span class="field-label">
            <label for="confirmar">Confirmar contraseña</label>
            <app-field-help
              field="Confirmar contraseña"
              message="Si cambias tu contraseña, repite aquí la nueva exactamente como la escribiste."
            />
          </span>
          <input
            id="confirmar"
            name="confirmar"
            type="password"
            [(ngModel)]="confirmarContrasena"
            autocomplete="new-password"
          />
        </div>

        <div class="campo">
          <span class="field-label">
            <label for="telefono">Teléfono</label>
            <app-field-help
              field="Teléfono"
              message="Escribe el celular que deseas asociar a tu perfil. Debe tener 9 dígitos y empezar por 9."
            />
          </span>
          <input
            id="telefono"
            name="telefono"
            type="tel"
            maxlength="9"
            inputmode="numeric"
            [(ngModel)]="telefono"
            required
          />
        </div>

        @if (error) {
          <div class="mensaje-error" role="alert">
            {{ error }}
          </div>
        }

        @if (aviso) {
          <div class="mensaje-aviso" role="status">
            {{ aviso }}
          </div>
        }

        <div class="acciones">
          <button type="button" class="boton-eliminar" (click)="eliminarCuenta()">
            Eliminar cuenta
          </button>

          <button type="submit" class="boton-guardar" [disabled]="guardando">
            {{ guardando ? 'GUARDANDO...' : 'Guardar datos' }}
          </button>
        </div>

        @if (confirmarEliminacion) {
          <div class="confirmar-eliminacion">
            <span class="field-label">
              <label for="contrasenaEliminar">Ingrese su contraseña actual para confirmar:</label>
              <app-field-help
                field="Contraseña para confirmar"
                message="Ingresa la contraseña vigente de tu cuenta para autorizar su desactivación."
              />
            </span>

            <input
              id="contrasenaEliminar"
              name="contrasenaEliminar"
              type="password"
              [(ngModel)]="contrasenaEliminar"
              autocomplete="current-password"
              placeholder="Contraseña actual"
            />

            <p class="nota-seguridad">
              Al continuar, su cuenta será desactivada y no podrá volver a iniciar sesión.
            </p>

            <div class="acciones-confirmacion">
              <button
                type="button"
                class="boton-cancelar"
                [disabled]="eliminando"
                (click)="cancelarEliminacion()"
              >
                Cancelar
              </button>

              <button
                type="button"
                class="boton-confirmar"
                [disabled]="eliminando || !contrasenaEliminar.trim()"
                (click)="confirmarEliminarCuenta()"
              >
                {{ eliminando ? 'ELIMINANDO...' : 'Sí, eliminar cuenta' }}
              </button>
            </div>
          </div>
        }

        <button type="button" class="boton-volver" (click)="volverPerfil()">
          Volver a Mi perfil
        </button>
      </form>
    </div>
  </div>
</div>
