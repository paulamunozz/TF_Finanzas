
<div class="registro-page">

<header class="topbar">
    <div class="logo-small">✓</div>

    <div class="header-actions">
    <a routerLink="/login">Iniciar Sesión</a>
    <div class="avatar">●</div>
    </div>
</header>

<main class="registro-content">

    <div class="logo-big">✓</div>

    @if (registrado) {

    <h1>¡Cuenta creada!</h1>

    <div class="alert-success" role="status">
        Tu cuenta fue registrada correctamente.
    </div>

    <a routerLink="/login" class="btn-registro">
        IR A INICIAR SESIÓN
    </a>

    } @else {

    <h1>Regístrate</h1>

    @if (error) {
        <div class="alert-error" role="alert">
        {{ error }}
        </div>
    }

    <form
        class="registro-form"
        (ngSubmit)="registrarCliente()"
        novalidate>

        <div class="form-group">
        <label for="dni">DNI</label>
        <input
            id="dni"
            type="text"
            name="dni"
            [(ngModel)]="dni"
            maxlength="8"
            inputmode="numeric"
            placeholder="Ingrese su DNI"
            required
        />
        </div>

        <div class="form-group">
        <label for="nombre">Nombre</label>
        <input
            id="nombre"
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Ingrese su nombre"
            required
        />
        </div>

        <div class="form-group">
        <label for="apellido">Apellido</label>
        <input
            id="apellido"
            type="text"
            name="apellido"
            [(ngModel)]="apellido"
            placeholder="Ingrese su apellido"
            required
        />
        </div>

        <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input
            id="contrasena"
            type="password"
            name="contrasena"
            [(ngModel)]="contrasena"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            required
        />
        </div>

        <div class="form-group">
        <label for="confirmar">Confirmar contraseña</label>
        <input
            id="confirmar"
            type="password"
            name="confirmar"
            [(ngModel)]="confirmarContrasena"
            autocomplete="new-password"
            required
        />
        </div>

        <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input
            id="telefono"
            type="tel"
            name="telefono"
            [(ngModel)]="telefono"
            maxlength="9"
            inputmode="numeric"
            placeholder="Ingrese su celular"
            required
        />
        </div>

        <button
        type="submit"
        class="btn-registro"
        [disabled]="cargando">

        {{ cargando ? 'REGISTRANDO...' : 'CREAR CUENTA' }}

        </button>

    </form>

    <p class="login-text">
        ¿Ya tienes una cuenta?
        <a routerLink="/login">Inicia sesión</a>
    </p>

    }

</main>
</div>
