name: Cuentix integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cuentix-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: Cuentix-front/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --watch=false
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Cuentix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: bash ./mvnw -B test
