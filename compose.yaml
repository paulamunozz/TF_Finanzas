name: cuentix

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: cuentix
      POSTGRES_USER: cuentix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - datos:/var/lib/postgresql/data
      - ./Cuentix/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cuentix -d cuentix"]
      interval: 3s
      timeout: 3s
      retries: 40

  demo:
    image: postgres:17-bookworm
    environment:
      PGHOST: db
      PGDATABASE: cuentix
      PGUSER: cuentix
      PGPASSWORD: ${DB_PASSWORD}
      CUENTIX_DEMO_PASSWORD: ${CUENTIX_DEMO_PASSWORD:?Configura CUENTIX_DEMO_PASSWORD en .env}
    volumes:
      - ./docker/demo.sql:/cuentix/demo.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/cuentix/demo.sql"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./Cuentix
    environment:
      DB_URL: jdbc:postgresql://db:5432/cuentix
      DB_USERNAME: cuentix
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: America/Lima
    depends_on:
      demo:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/auth/session HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 401 '"]
      interval: 5s
      timeout: 4s
      retries: 40

  frontend:
    build: ./Cuentix-front
    ports:
      - "127.0.0.1:${CUENTIX_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datos:
